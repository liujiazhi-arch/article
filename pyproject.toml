[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "thesis-format-tool"
version = "0.1.0"
description = "Structured audit and scoped fix tool for Chinese thesis .docx formatting"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "python-docx>=1.1,<2",
  "PyYAML>=6,<7",
]

[project.optional-dependencies]
api = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
  "python-multipart>=0.0.9,<1",
]
dev = [
  "pytest>=8,<9",
  "httpx>=0.27,<1",
]

[project.scripts]
thesis-workbench = "thesis_workbench:main"
article-local = "article_api.local_app:main"
article-api = "article_api.local_app:serve_main"
article-doctor = "article_api.local_app:doctor_main"
article-backup = "article_api.local_app:backup_main"
article-restore = "article_api.local_app:restore_main"
article-maintain = "article_api.local_app:maintain_main"

[tool.setuptools]
package-dir = {"" = "scripts"}
py-modules = [
  "audit_thesis",
  "fix_thesis",
  "fix_docx_io",
  "fix_output_parts",
  "thesis_workbench",
  "_profile_utils",
  "_thesis_utils",
]

[tool.setuptools.packages.find]
where = ["scripts"]
include = [
  "thesis_tool",
  "thesis_tool.*",
  "sections",
  "sections.*",
  "article_engine",
  "article_engine.*",
  "article_api",
  "article_api.*",
]

[tool.setuptools.package-data]
article_api = ["local_console.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
