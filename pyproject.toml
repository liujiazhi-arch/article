[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "thesis-format-tool"
version = "0.1.2"
description = "Structured audit and scoped fix tool for Chinese thesis .docx formatting"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "python-docx>=1.1,<2",
  "PyYAML>=6,<7",
  "pypdfium2>=5,<6",
  "Pillow>=11,<13",
]

[project.optional-dependencies]
api = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
  "python-multipart>=0.0.9,<1",
]
dev = [
  "pytest>=8,<9",
  "httpx>=0.27,<1",
]

[project.scripts]
thesis-workbench = "thesis_workbench:main"
lnu-thesis-local = "article_api.local_app:main"
lnu-thesis-api = "article_api.local_app:serve_main"
lnu-thesis-doctor = "article_api.local_app:doctor_main"
lnu-thesis-backup = "article_api.local_app:backup_main"
lnu-thesis-feedback = "article_api.local_app:feedback_main"
lnu-thesis-restore = "article_api.local_app:restore_main"
lnu-thesis-maintain = "article_api.local_app:maintain_main"
article-local = "article_api.local_app:main"
article-api = "article_api.local_app:serve_main"
article-doctor = "article_api.local_app:doctor_main"
article-backup = "article_api.local_app:backup_main"
article-feedback = "article_api.local_app:feedback_main"
article-restore = "article_api.local_app:restore_main"
article-maintain = "article_api.local_app:maintain_main"

[tool.setuptools]
package-dir = {"" = "scripts"}
include-package-data = true
py-modules = [
  "audit_thesis",
  "fix_thesis",
  "fix_docx_io",
  "fix_output_parts",
  "thesis_workbench",
  "thesis_resources",
  "docx_sample_intake",
  "fetch_public_docx_samples",
  "release_smoke",
  "local_browser_smoke",
  "ooxml_namespaces",
  "github_release_status",
  "release_evidence_gate",
  "release_evidence_bundle",
  "release_url_utils",
  "verify_release_artifact",
  "build_windows_local_bundle",
  "windows_bundle_smoke",
  "windows_bundle_contract",
  "smoke_workdir_utils",
  "install_article_local",
  "_profile_utils",
  "_thesis_utils",
  "backmatter_title_utils",
  "citation_text_utils",
  "cli_json_output",
  "file_hash_utils",
  "frontmatter_utils",
  "reference_numbering_utils",
  "reference_section_utils",
  "reorder_references_by_appearance",
  "text_spacing_utils",
]

[tool.setuptools.packages.find]
where = ["scripts"]
include = [
  "thesis_tool",
  "thesis_tool.*",
  "thesis_rules",
  "thesis_rules.*",
  "thesis_fix",
  "thesis_fix.*",
  "sections",
  "sections.*",
  "article_engine",
  "article_engine.*",
  "article_api",
  "article_api.*",
]

[tool.setuptools.package-data]
article_api = [
  "static/**/*.html",
  "static/**/*.css",
  "static/**/*.js",
  "static/assets/**",
]

[tool.setuptools.exclude-package-data]
article_api = ["local_console.html", "assets/*"]

[tool.setuptools.data-files]
"share/thesis-format-tool/config" = ["config/capability_matrix.md", "config/sources.yaml"]
"share/thesis-format-tool/config/profiles" = ["config/profiles/*.yaml"]
"share/thesis-format-tool/config/templates/lnu" = [
  "config/templates/lnu/*.md",
  "config/templates/lnu/*.xml",
]
"share/thesis-format-tool/config/templates/lnu/cover-assets" = [
  "config/templates/lnu/cover-assets/*",
]
