# 辽宁大学本科毕业论文格式 Profile（官方版）
# 继承自 CN-Common，严格按照辽宁大学官方模板覆盖所有差异项
# 数据来源：辽宁大学官方论文样本（理工类）PDF + DOC 双版本核对
# 文件（已归档至项目）：
#   references/lnu/lnu-undergraduate-format-spec.pdf     （原：26BDF01BF6EADB5189164EB297C_3EF799F3_66559.pdf）
#   references/lnu/lnu-undergraduate-format-template.doc （原：20250608_4-1 毕业论文样本（理工类）(2).doc）
# 更新日期：2026-04-07
# 注意：此Profile以官方样本为准，优先级高于CN-Common

meta:
  id: lnu-undergraduate
  extends: CN-Common
  school: 辽宁大学
  dept: 教务处
  scope: undergraduate
  pub_date: "2025"       # 模板内日期：202×年，推测为近年版本
  access_date: "2026-04-07"
  doc_url: null          # 用户提供的本地官方文件
  notes: |
    严格按照辽宁大学官方论文样本（理工类）设定。
    PDF与DOC内容一致，以此为唯一数据来源。
    与CN-Common的主要差异：
    - 页边距全部2.5cm + 装订线0.5cm（非CN-Common的上左30mm）
    - 图表编号用点号（图2.1），不用横线（图2-1）
    - 关键词3-5个（非3-8个），黑体小四，不加粗
    - 参考文献标点用英文半角
    - 参考文献编号用 [N] + 单空格，第二行采用悬挂缩进对齐
    - 致谢用仿宋小四
    2026-04-07校准：已重新核对最后保存于2025-06-08的新版样本
    《20250608_4-1 毕业论文样本（理工类）(2).doc》，并沿用其中的
    关键词、摘要标题字号、英文摘要行距、四级标题字体等修订。

# ========== 差异覆盖项（完整列出所有与CN-Common不同的项）==========
overrides:

  # ---------- 页面 ----------

  # 页边距：上下左右全部2.5cm，装订线（左）0.5cm
  # 官方原文：上2.5cm，下2.5cm，左2.5cm，右2.5cm，装订线（左）0.5cm
  - id: P01
    expected:
      top_dxa: 1418       # 2.5cm = 1418 DXA（1cm≈567 DXA）
      bottom_dxa: 1418
      left_dxa: 1418      # 2.5cm（装订线单独0.5cm=283 DXA，由gutter字段设置）
      right_dxa: 1418
      gutter_dxa: 283     # 装订线（左）0.5cm
    tolerance_override: margin_dxa
    notes: "辽宁大学：四周均为2.5cm，另设装订线0.5cm（左侧）"

  # ---------- 正文 ----------
  # 行距：多倍行距1.5（与CN-Common一致，但官方明确"取消网格对齐"）
  - id: T04
    expected:
      line_rule: auto
      line_value: 360     # 240*1.5=360
    fix_extra: "disable_snap_to_grid()"
    notes: "辽宁大学明确要求取消网格对齐（contextualSpacing=false，snapToGrid=false）"

  # ---------- 一级标题 ----------
  # 官方原文：黑体，三号（16pt），居中
  - id: H01
    expected:
      east_asia_font: "黑体"
      half_points: 32     # 16pt = 三号（官方：黑体三号居中）
      bold: false
      alignment: center
      space_before_lines: 0.5    # 段前0.5行（新版样本）
      space_after_lines: 0.5     # 段后0.5行（新版样本）
    notes: "辽宁大学一级标题：黑体三号（16pt），居中。注意：比CN-Common的15pt大1pt，段前后各0.5行"

  # 二级标题：黑体，四号（14pt），左对齐
  - id: H02
    expected:
      east_asia_font: "黑体"
      half_points: 28     # 14pt = 四号
      bold: false
      alignment: left
      space_before_lines: 0.5    # 段前0.5行（新版样本）
      space_after_lines: 0.5     # 段后0.5行（新版样本）
    notes: "辽宁大学二级标题：黑体四号（14pt），段前后各0.5行"

  # 三级标题：黑体，小四（12pt），左对齐
  - id: H03
    expected:
      east_asia_font: "黑体"
      half_points: 24     # 12pt = 小四
      bold: false
      alignment: left
      space_before_lines: 0.5    # 段前0.5行（新版样本）
      space_after_lines: 0.5     # 段后0.5行（新版样本）
    notes: "辽宁大学三级标题：黑体小四（12pt），段前后各0.5行"

  # 四级标题：宋体，小四（12pt），左对齐，缩进2字符（新版样本明确）
  - id: H04
    expected:
      east_asia_font: "宋体"
      half_points: 24     # 12pt = 小四
      bold: false
      alignment: left
      indent_chars: 2
      space_before_lines: 0.5    # 段前0.5行（新版样本）
      space_after_lines: 0.5     # 段后0.5行（新版样本）
    notes: "辽宁大学四级标题：宋体小四（12pt），缩进2字符。注意：字体为宋体，非黑体，段前后各0.5行"

  # ---------- 图/表题字号（官方：五号=10.5pt，与CN-Common一致）----------
  # F01/F02 不变，CN-Common的21 half-points正确

  # ---------- 关键词（官方：3-5个，黑体小四，不加粗）----------
  - id: KW01
    expected:
      min: 3
      max: 5              # 官方明确3-5个（非3-8个）
      font: "黑体"
      bold: false
      half_points: 24     # 小四
      separator: "；"
    notes: "辽宁大学关键词：3-5个，黑体小四不加粗，分号间隔，末尾无标点"

  # ---------- 页码（官方：—N—格式，宋体五号，居中底部）----------
  - id: PG01
    expected: "页码格式：—数字—（破折号包围），宋体五号，页面底端居中，正文从1开始"
    notes: "辽宁大学页码格式：—1—，不是纯数字"

  # ---------- 参考文献悬挂缩进 ----------
  - id: R01
    expected:
      hanging_dxa: 420
    notes: |
      官方样本文本说明：单条文献第二行需要缩进对齐即可。
      辽大参考文献采用悬挂缩进，不使用正文首行缩进。
      为了让 [1] 到 [10] 的视觉更自然，辽大 profile 固定为 420 twips。

# ========== 辽宁大学特有规则（当前 runtime 已接入）==========
additions:

  # ---------- 图编号格式：图X.X（点号，非横线）----------
  - id: LNU_F01
    module: figure
    scope: undergraduate
    severity: important
    check_level: Auto
    description: "图编号格式：图X.X（章.序号，用点号），如图2.1"
    expected_pattern: "^图\\s*\\d+\\.\\d+"
    method: docx-structure
    evidence: "图题段落文本正则匹配"
    notes: |
      官方样本用点号：图2.1、图2.2（不是图2-1）
      覆盖CN-Common的F03规则（F03用横线格式图X-Y）
      如果你的论文用横线格式，需要手动改为点号格式
    fix: "fix_caption_number_sep(sep='.')"
    source: lnu-undergraduate

  # ---------- 表编号格式：表X.X（点号）----------
  - id: LNU_F02
    module: figure
    scope: undergraduate
    severity: important
    check_level: Auto
    description: "表编号格式：表X.X（章.序号，用点号），如表2.1"
    expected_pattern: "^表\\s*\\d+\\.\\d+"
    method: docx-structure
    evidence: "表题段落文本正则匹配"
    notes: "官方样本用点号：表2.1、表2.2（覆盖CN-Common的F04）"
    fix: "fix_caption_number_sep(sep='.')"
    source: lnu-undergraduate

  # ---------- 表格边框：外框1.5pt，内线0.5pt ----------
  - id: LNU_TB01
    module: table
    scope: undergraduate
    severity: important
    check_level: Auto
    description: "表格外框线1.5pt，内线0.5pt"
    expected:
      outer_border_size_eighth_pt: 18
      inner_border_size_eighth_pt: 6
    method: docx-structure
    evidence: "表格边框 w:top/w:bottom=18，insideH=6"
    notes: |
      当前 runtime 检查并修复边框线宽，不覆盖“表名前后空行”这类渲染型要求。
    fix: "fix_table_borders(top_bottom_sz=18, header_sz=6)"
    source: lnu-undergraduate

  # ---------- 表格内容字号：宋体五号（10.5pt）----------
  - id: LNU_TB02
    module: table
    scope: undergraduate
    severity: minor
    check_level: Auto
    description: "表格内容字号：宋体五号（10.5pt，21 half-points）"
    expected:
      east_asia_font: "宋体"
      half_points: 21
    method: docx-structure
    evidence: "表格单元格段落 w:sz[@w:val='21']"
    notes: "官方原文：表内文字全文统一，设置为宋体，五号"
    fix: "fix_table_cell_font(east_asia='宋体', half_points=21)"
    source: lnu-undergraduate

  # ---------- 参考文献标点：使用英文半角 ----------
  - id: LNU_REF01
    module: reference
    scope: undergraduate
    severity: important
    check_level: Semi
    description: "参考文献中标点符号使用英文半角（句点.，逗号,，冒号:）"
    expected: "参考文献列表中所有标点为英文半角"
    method: docx-structure
    evidence: "参考文献段落文本检测全角标点（。，：）"
    notes: |
      官方原文（文本框标注）：参考文献中标点符号使用英文
      示例：[1] 郭光灿.量子光学[M]. 北京:高等教育出版社,2005,463.
      注意：句号用.（半角），冒号用:（半角），逗号用,（半角）
      覆盖CN-Common的REF01（REF01检查的是末尾标点）
    fix: "fix_lnu_ref01()"
    source: lnu-undergraduate

  # ---------- 参考文献编号格式：[N] 空格（无Tab）----------
  - id: LNU_REF02
    module: reference
    scope: undergraduate
    severity: important
    check_level: Auto
    description: "参考文献编号格式：[N] 空格内容（无制表符Tab）"
    expected_pattern: "^\\[\\d+\\]\\s+"
    method: docx-structure
    evidence: "参考文献段落文本正则：[N]后跟空格，非Tab"
    notes: |
      官方样本实际格式：[1] 郭光灿.量子光学...（方括号+空格）
      注意：与CN-Common的R05不同，官方用空格不用Tab
      单双位数编号对齐用悬挂缩进处理，第二行与文献正文起始处对齐
    fix: "fix_lnu_ref02()"
    source: lnu-undergraduate

  # ---------- 致谢：仿宋小四 ----------
  - id: LNU_ACK01
    module: acknowledgement
    scope: undergraduate
    severity: minor
    check_level: Auto
