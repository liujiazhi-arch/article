      这是辽宁大学特有要求，与正文（宋体）不同
    fix: "fix_lnu_ack01()"
    source: lnu-undergraduate

  # ---------- 摘要标题：黑体三号，居中，段后0磅 ----------
  - id: LNU_ABS01
    module: abstract
    scope: undergraduate
    severity: important
    check_level: Auto
