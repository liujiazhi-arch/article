# 军事科学院研究生学位论文格式 Profile
# 继承自 CN-Common，覆盖差异项，增加军队特有规则
# 数据来源：基于军队院校通用规范 + GB/T 7713.2-2022 + 军事科学院公开论文逆向推断
# 注意：军事科学院规范属内部文件，请以导师/研究所下发的官方模板为准

meta:
  id: ams-graduate
  extends: CN-Common
  school: 军事科学院
  full_name: 中国人民解放军军事科学院
  dept: 研究生部
  scope: [master, phd]
  pub_date: "2023"      # 推断版本，非官方
  access_date: "2026-03-25"
  doc_url: null         # 内部文件，无公开URL
  notes: |
    军事科学院研究生学位论文格式，基于CN-Common差异覆盖。
    军队特有要求：保密标注、部队代号、版权声明等。
    正文排版参数与国标基本一致，主要差异在保密页眉和封面。
    请向导师或研究所索取官方Word模板文件以确认所有参数。

# ========== 规范记录（当前 runtime 未直接消费）==========
reference_overrides:

  # 页边距：上左30mm，下右25mm（军队惯例留装订线）
  - id: P01
    expected:
      top_dxa: 1701       # 30mm
      bottom_dxa: 1418    # 25mm
      left_dxa: 1701      # 30mm（装订侧）
      right_dxa: 1418     # 25mm
    notes: "军事科学院：上左30mm，下右25mm，装订侧预留"

  # 一级标题：黑体，三号（16pt），加粗，居中
  - id: H01
    expected:
      east_asia_font: "黑体"
      half_points: 32     # 16pt = 三号
      bold: true
      alignment: center
    notes: "军事科学院一级标题：黑体三号（16pt），比CN-Common大1pt"

  # 二级标题：黑体，四号（14pt），加粗，左对齐
  - id: H02
    expected:
      east_asia_font: "黑体"
      half_points: 28     # 14pt = 四号
      bold: true
      alignment: left
    notes: "军事科学院二级标题：黑体四号（14pt）"

  # 三级标题：宋体加粗，小四（12pt），左对齐
  - id: H03
    expected:
      east_asia_font: "宋体"    # 注意：三级用宋体，非黑体
      half_points: 24
      bold: true
      alignment: left
    notes: "军事科学院三级标题字体为宋体加粗（非黑体）"

  # 页眉：奇数页论文题目，偶数页学校名称（研究生）
  - id: P02
    expected: "奇数页：论文题目；偶数页：军事科学院博士/硕士学位论文"
    notes: "双面印刷，奇偶页页眉不同"
    check_level: Manual

  # 参考文献字号：五号（10.5pt）
  - id: R_FONT
    module: reference
    scope: [master, phd]
    severity: important
    check_level: Auto
    description: "参考文献字号：五号（10.5pt）"
    expected:
      half_points: 21
    method: docx-structure
    evidence: "参考文献段落 w:sz[@w:val='21']"
    notes: "研究生论文参考文献字号为五号"
    fix: "set_reference_font_size(21)"
    source: ams-graduate

# ========== 军事科学院特有规则（参考项，当前 runtime 未接入）==========
reference_additions:

  # --- 保密相关（核心差异）---

  - id: AMS01
    module: security
    scope: [master, phd]
    severity: critical
    check_level: Manual
    description: "封面右上角密级标注（公开/秘密/机密/绝密）"
    expected: "封面右上角有密级标注"
    method: rendered-layout
    evidence: null
    notes: |
      涉密论文密级格式：绝密★ / 机密★ / 秘密★
      非涉密论文标注：公开
      人工确认，程序不检查保密内容
    fix: null
    source: ams-graduate

  - id: AMS02
    module: security
    scope: [master, phd]
    severity: important
    check_level: Manual
    description: "封面注明保密期限（涉密论文）"
    expected: "保密期限格式：（保密期限：X年，解密日期：YYYY年MM月DD日）"
    method: rendered-layout
    evidence: null
    notes: "仅涉密论文需要，非涉密跳过"
    fix: null
    source: ams-graduate

  - id: AMS03
    module: security
    scope: [master, phd]
    severity: important
    check_level: Manual
    description: "每页页眉含密级标记（涉密论文）"
    expected: "页眉左侧或居中有【秘密】等密级标注"
    method: rendered-layout
    evidence: null
    notes: "涉密论文每页都需标注，人工确认"
    fix: null
    source: ams-graduate

  # --- 封面与前置部分 ---

  - id: AMS04
    module: cover
    scope: [master, phd]
    severity: important
    check_level: Manual
    description: "封面包含：学校全称、论文类型、题目、研究所、专业、学号、姓名、导师、完成日期"
    expected: "封面元素完整"
    method: rendered-layout
    evidence: null
    notes: "军事科学院封面须用全称：中国人民解放军军事科学院"
    fix: null
    source: ams-graduate

  - id: AMS05
    module: cover
    scope: [master, phd]
    severity: minor
    check_level: Manual
    description: "封面/扉页注明研究所代号或名称"
    expected: "所属研究院/所名称或代号"
    method: rendered-layout
    evidence: null
    notes: "部分研究所用代号替代全称，以导师要求为准"
    fix: null
    source: ams-graduate

  - id: AMS06
    module: copyright
    scope: [master, phd]
    severity: important
    check_level: Manual
    description: "版权声明页（涉密论文须含军队保密声明）"
    expected: "含版权/保密声明，涉密论文须含'属国防科技秘密，未经批准不得传阅复制'等字样"
    method: rendered-layout
    evidence: null
    notes: "非涉密论文版权声明同普通高校，涉密需特殊声明"
    fix: null
    source: ams-graduate

  # --- 摘要与关键词 ---

  - id: AMS07
    module: abstract
    scope: [master, phd]
    severity: important
    check_level: Auto
    description: "中英文双语摘要，各300-500字，关键词3-8个"
    expected:
      keyword_min: 3
      keyword_max: 8
    method: docx-structure
    evidence: "摘要页关键词段落"
    notes: "英文摘要不得泄露涉密内容（涉密论文）"
    fix: null
    source: ams-graduate

  # --- 目录 ---

  - id: AMS08
    module: toc
    scope: [master, phd]
    severity: minor
    check_level: Manual
    description: "目录显示至三级标题，页码右对齐"
    expected: "目录含至少三级，使用制表位右对齐页码"
    method: rendered-layout
    evidence: null
    notes: null
    fix: null
    source: ams-graduate

  # --- 章节编号格式 ---

  - id: AMS09
    module: heading
    scope: [master, phd]
    severity: important
    check_level: Auto
    description: "一级标题编号格式：第X章（中文数字）"
    expected_pattern: "^第[一二三四五六七八九十\\d]+章"
    method: docx-structure
    evidence: "一级标题段落文本正则匹配"
    notes: "军事科学院使用'第1章'或'第一章'，需统一"
    fix: null
    source: ams-graduate

  # --- 附录 ---

  - id: AMS10
    module: appendix
    scope: [master, phd]
    severity: minor
    check_level: Manual
    description: "涉密附件单独装订并标注密级"
    expected: "涉密图纸、数据单独成册"
    method: rendered-layout
    evidence: null
    notes: "非涉密论文无此要求"
    fix: null
    source: ams-graduate

# ========== Python 代码配置字段（当前 runtime 实际消费）==========
settings:
  h1_size: 32
  h2_size: 28
  h3_size: 24
  h1_font: "黑体"
  h2_font: "黑体"
  h3_font: "宋体"
  h1_bold: true
  h2_bold: true
  h3_bold: true
  ref_font_size: 21
