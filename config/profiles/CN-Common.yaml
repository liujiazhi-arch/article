    evidence: "图题段落文本匹配正则"
    notes: "检测是否为'图1'（非章节式），报告需修改为'图1-1'"
    fix: null
    source: CN-Common

  - id: F04
    module: figure
    scope: all
    severity: important
    check_level: Auto
    description: "表编号格式：表X-Y（章节式，如表1-1）"
    expected_pattern: "^表\\d+-\\d+"
    method: docx-structure
