    notes: "同F03"
    fix: null
    source: CN-Common

  - id: F05
    module: figure
    scope: all
    severity: minor
    check_level: Auto
    description: "图题/表题字体：宋体+Times New Roman"
    expected:
      east_asia_font: "宋体"
      ascii_font: "Times New Roman"
    method: docx-structure
    evidence: "题注段落 w:rFonts"
    notes: null
    fix: "fix_caption_paragraph()"
    source: CN-Common

  - id: F06
    module: figure
    scope: all
    severity: important
    check_level: Auto
    description: "图片段落居中，无首行缩进"
    expected:
      alignment: center
      first_line_indent: 0
    method: docx-structure
    evidence: "含w:drawing的段落"
    notes: "图片段落识别：w:r/w:drawing 存在"
    fix: "fix_figure_paragraph()"
    source: CN-Common

  - id: F07
    module: figure
    scope: all
    severity: minor
    check_level: Auto
    description: "图题末尾无句号"
    expected: "末尾字符不为'。'或'.'"
    method: docx-structure
    evidence: "图题段落文本末尾字符"
    notes: "表题末尾也不应有句号"
    fix: "trim_caption_terminal_punctuation()"
    source: CN-Common

# ========== 表格模块 ==========

  - id: TB01
    module: table
    scope: all
    severity: important
    check_level: Auto
    description: "三线表：顶线和底线（sz=12，约1.5磅），栏目线（sz=6，约0.75磅）"
    expected:
      top_bottom_sz: 12
      header_bottom_sz: 6
    method: docx-structure
    evidence: "w:tblBorders / w:trPr / w:tcBorders"
    notes: "检查：顶线/底线存在且sz≥10；第一行底部横线存在且比顶底线细"
    fix: "fix_table_borders(top_bottom_sz=12, header_sz=6)"
    source: CN-Common

  - id: TB03_LINE
    module: table
    scope: all
    severity: important
    check_level: Auto
    description: "三线表第一行栏目线"
    expected: "第一行下边框存在且细于顶线和底线"
    method: docx-structure
    evidence: "首行单元格 w:tcBorders/w:bottom"
    notes: "与三线表顶线和底线一起自动修复"
    fix: "fix_table_borders()"
    source: CN-Common

  - id: TB02
    module: table
    scope: all
    severity: minor
    check_level: Auto
    description: "三线表无竖线、无内部水平线（非栏目线）"
    expected: "insideH/insideV/left/right 均为none"
    method: docx-structure
    evidence: "w:tblBorders"
    notes: "三线表规范：只有3条横线，无竖线"
    fix: null
    source: CN-Common

  - id: TB03
    module: table
    scope: all
    severity: minor
    check_level: Semi
    description: "续表重复表头"
    expected: "跨页表格第一行设置w:tblHeader"
    method: docx-structure
    evidence: "w:tblHeader"
    notes: "能检测是否设置了tblHeader，但是否需要续表头需人工判断"
    fix: null
    source: CN-Common

# ========== 公式模块 ==========

  - id: EQ01
    module: equation
    scope: all
    severity: important
    check_level: Auto
    description: "公式段落居中，无首行缩进"
    expected:
      alignment: center
      first_line_indent: 0
    method: docx-structure
    evidence: "含m:oMathPara的段落"
    notes: "公式段落识别：w:r/m:oMathPara 或 m:oMath 存在"
    fix: "fix_equation_paragraph()"
    source: CN-Common

  - id: EQ02
    module: equation
    scope: all
    severity: important
    check_level: Semi
    description: "公式编号右对齐，格式(X-Y)"
    expected_pattern: "\\(\\d+-\\d+\\)"
    method: docx-structure
    evidence: "公式段落末尾run文本，右制表位"
    notes: "能检测编号格式与编号段对齐；仅把已存在的编号段右对齐，不移动公式对象"
    fix: "fix_equation_number_alignment()"
    source: CN-Common

  - id: EQ03
    module: equation
    scope: all
    severity: minor
    check_level: Manual
    description: "正文中公式引用格式：式(X-Y)"
    expected_pattern: "式\\(\\d+-\\d+\\)"
    method: docx-structure
    evidence: "正文文本正则匹配"
    notes: "只自动修复同一 run 内的明确格式错误；跨 run 引用和语义对应关系需人工核对"
    fix: "fix_equation_reference_text()"
    source: CN-Common

  - id: EQ04
    module: equation
    scope: all
    severity: minor
    check_level: Manual
    description: "公式变量字体：变量斜体，常数/函数正体"
    expected: "MathML字体规范"
    method: rendered-layout
    evidence: null
    notes: "依赖语义判断，无法自动检查，标Manual"
    fix: null
    source: CN-Common

