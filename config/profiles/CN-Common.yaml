# CN-Common.yaml — 中国高校论文格式通用基线规则库 v1.0
# 覆盖范围：页面 / 正文 / 标题 / 图 / 表 / 公式 / 参考文献 / 标点 / 脚注 / 其他
# check_level: Auto（程序自动检查） / Semi（程序定位，人工确认） / Manual（人工复核）
# method: docx-structure（读XML即可） / rendered-layout（依赖Word排版渲染）
# scope: undergraduate=本科 / master=硕士 / phd=博士 / all=通用

meta:
  id: CN-Common
  version: "1.0"
  pub_date: "2026-03-25"
  scope: all
  description: "中国高校论文格式通用基线，覆盖各校共性要求，差异项由学校Profile覆盖"
  catalog:
    support_level:
      id: primary
      label: 一等支持
    support_scenarios:
      - id: course_assignment_basic_paper
        label: 课程作业/基础论文
        document_types:
          - 课程作业
          - 基础论文
      - id: general_paper_review
        label: 普通论文或综述
        document_types:
          - 普通论文
          - 综述
  source_refs:
    - GB/T 7714-2015
    - GB/T 15834-2011
    - 教育部学位论文规范（2020）

# ---------- 全局容差配置 ----------
tolerance:
  font_size_pt: 0.5          # 字号允许误差（磅）
  indent_cm: 0.02            # 首行缩进允许误差（厘米）
  margin_dxa: 28             # 页边距允许误差（DXA，约0.05cm）
  line_spacing_pct: 3        # 行距允许误差（百分比，适用倍数行距）

# ========== 页面模块 ==========
rules:

  - id: P01
    module: page
    scope: all
    severity: important
    check_level: Auto
    description: "页边距检查"
    expected:
      top_dxa: 1440           # 2.54cm
      bottom_dxa: 1440
      left_dxa: 1800          # 3.17cm（装订线）
      right_dxa: 1440
    tolerance_override: margin_dxa
    method: docx-structure
    evidence: "w:pgMar"
    notes: "各校差异大，此为最常见默认值，学校Profile应覆盖此项"
    fix: "set_page_margins(top=1440, bottom=1440, left=1800, right=1440)"
    source: CN-Common

  - id: P02
    module: page
    scope: all
    severity: minor
    check_level: Semi
    description: "页眉内容（奇偶页分置）"
    expected: "奇数页：章标题；偶数页：论文题目（各校不同）"
    method: rendered-layout
    evidence: null
    notes: "依赖渲染，无法纯读XML可靠判断，标Manual"
    fix: null
    source: CN-Common

  - id: P03
    module: page
    scope: all
    severity: minor
    check_level: Auto
    description: "页码位置：页面底端居中"
    expected: "footer居中，阿拉伯数字"
    method: docx-structure
    evidence: "w:ftr > w:p > w:pPr > w:jc[@w:val='center']"
    notes: "检查footer段落是否居中，不检查起始页码值"
    fix: null
    source: CN-Common

# ========== 正文模块 ==========

  - id: T01
    module: body
    scope: all
    severity: critical
    check_level: Auto
    description: "正文中文字体：宋体"
    expected: "宋体"
    tolerance: null
    method: docx-structure
    evidence: "w:rFonts[@w:eastAsia='宋体']"
    notes: "仅检查正文段落，不含标题、题注、参考文献"
    fix: "set_east_asia_font('宋体')"
    source: CN-Common

  - id: T02
    module: body
    scope: all
    severity: critical
    check_level: Auto
    description: "正文西文字体：Times New Roman"
    expected: "Times New Roman"
    tolerance: null
    method: docx-structure
    evidence: "w:rFonts[@w:ascii='Times New Roman']"
    notes: "同T01，仅正文段落"
    fix: "set_ascii_font('Times New Roman')"
    source: CN-Common

  - id: T03
    module: body
    scope: all
    severity: critical
    check_level: Auto
    description: "正文字号：12pt（24 half-points）"
    expected:
      half_points: 24
    tolerance_override: font_size_pt
    method: docx-structure
    evidence: "w:sz[@w:val='24']"
    notes: "小四号=12pt，允许±0.5pt容差"
    fix: "set_font_size(24)"
    source: CN-Common

  - id: T04
    module: body
    scope: all
    severity: important
    check_level: Auto
    description: "正文行距：1.5倍（或固定值20pt）"
    expected:
      line_rule: auto         # auto=倍数行距
      line_value: 360         # 240*1.5=360 twips
    tolerance_override: line_spacing_pct
    method: docx-structure
    evidence: "w:spacing[@w:lineRule='auto'][@w:line='360']"
    notes: "部分学校用固定值20pt（line=400，lineRule=exact），Profile可覆盖"
    fix: "set_line_spacing(rule='auto', value=360)"
    source: CN-Common

  - id: T05
    module: body
    scope: all
    severity: critical
    check_level: Auto
    description: "正文首行缩进：2字符（约0.74cm / 480 twips）"
    expected:
      ind_cm: 0.74
      ind_dxa: 480
    tolerance_override: indent_cm
    method: docx-structure
    evidence: "w:ind[@w:firstLine='480']"
    notes: "三重检查：存在性 + 标准值（±0.02cm） + 全文统一性"
    fix: "set_first_line_indent(480)"
    source: CN-Common

  - id: T06
    module: body
    scope: all
    severity: important
    check_level: Auto
    description: "正文两端对齐"
    expected: "both"
    method: docx-structure
    evidence: "w:jc[@w:val='both']"
    notes: null
    fix: "set_justification('both')"
    source: CN-Common

  - id: SP01
    module: body
    scope: all
    severity: minor
    check_level: Auto
    description: "关闭中英文间自动空格"
    expected: "w:autoSpaceDE=false"
    method: docx-structure
    evidence: "w:autoSpaceDE[@w:val='0']"
    notes: "Word默认开启，容易被忽视"
    fix: "set_auto_space_de(False)"
    source: CN-Common

  - id: SP02
    module: body
    scope: all
    severity: minor
    check_level: Auto
    description: "关闭中文与数字间自动空格"
    expected: "w:autoSpaceDN=false"
    method: docx-structure
    evidence: "w:autoSpaceDN[@w:val='0']"
    notes: "同SP01"
    fix: "set_auto_space_dn(False)"
    source: CN-Common

# ========== 标题模块 ==========

  - id: H01
    module: heading
    scope: all
    severity: critical
    check_level: Auto
    description: "一级标题：黑体，15pt，加粗，居中"
    expected:
      east_asia_font: "黑体"
      half_points: 30         # 15pt
      bold: true
      alignment: center
    method: docx-structure
    evidence: "outlineLvl=0 段落"
    notes: "字体用黑体不用宋体，是一级标题的关键特征"
    fix: "fix_heading(level=1, font='黑体', size=30, bold=True, align='center')"
    source: CN-Common

  - id: H02
    module: heading
    scope: all
    severity: important
    check_level: Auto
    description: "二级标题：黑体，15pt，加粗，左对齐"
    expected:
      east_asia_font: "黑体"
      half_points: 30
      bold: true
      alignment: left
    method: docx-structure
    evidence: "outlineLvl=1 段落"
    notes: null
    fix: "fix_heading(level=2, font='黑体', size=30, bold=True, align='left')"
    source: CN-Common

  - id: H03
    module: heading
    scope: all
    severity: important
    check_level: Auto
    description: "三级标题：黑体，12pt，加粗，左对齐"
    expected:
      east_asia_font: "黑体"
      half_points: 24
      bold: true
      alignment: left
    method: docx-structure
    evidence: "outlineLvl=2 段落"
    notes: null
    fix: "fix_heading(level=3, font='黑体', size=24, bold=True, align='left')"
    source: CN-Common

  - id: H04
    module: heading
    scope: all
    severity: minor
    check_level: Auto
    description: "四级标题：黑体，12pt，加粗，左对齐"
    expected:
      east_asia_font: "黑体"
      half_points: 24
      bold: true
      alignment: left
    method: docx-structure
    evidence: "outlineLvl=3 段落"
    notes: null
    fix: "fix_heading(level=4, font='黑体', size=24, bold=True, align='left')"
    source: CN-Common

  - id: S01
    module: heading
    scope: all
    severity: minor
    check_level: Auto
    description: "标题段前段后间距（一级24pt/18pt，二级12pt/6pt）"
    expected:
      h1: {before_pt: 24, after_pt: 18}
      h2: {before_pt: 12, after_pt: 6}
      h3: {before_pt: 6, after_pt: 6}
    method: docx-structure
    evidence: "w:spacing[@w:before][@w:after]"
    notes: "部分学校有差异，tolerance可适当放宽"
    fix: null
    source: CN-Common

  - id: S02
    module: heading
    scope: all
    severity: minor
    check_level: Auto
    description: "章标题前分页（每章从新页开始）"
    expected: "w:pageBreakBefore=true"
    method: docx-structure
    evidence: "w:pageBreakBefore[@w:val='1']"
    notes: "仅对一级标题（第X章）检查，不对二级及以下"
    fix: null
    source: CN-Common

  - id: S03
    module: body
    scope: all
    severity: minor
    check_level: Auto
    description: "正文段前段后间距为0"
    expected: {before_pt: 0, after_pt: 0}
    method: docx-structure
    evidence: "正文段落 w:spacing[@w:before][@w:after]"
    notes: "正文格式化时统一处理"
    fix: "fix_body_paragraph()"
    source: CN-Common

# ========== 图模块 ==========

  - id: F01
    module: figure
    scope: all
    severity: important
    check_level: Auto
    description: "图题字号：10.5pt（五号，21 half-points）"
    expected:
      half_points: 21
    tolerance_override: font_size_pt
    method: docx-structure
    evidence: "图题段落 w:sz[@w:val='21']"
    notes: "图题段落识别：以'图'+'数字'开头"
    fix: "set_caption_font_size(21)"
    source: CN-Common

  - id: F02
    module: figure
    scope: all
    severity: important
    check_level: Auto
    description: "表题字号：10.5pt（五号，21 half-points）"
    expected:
      half_points: 21
    tolerance_override: font_size_pt
